# Runs on every push and pull request. A red build blocks merging (enable
# "Require status checks" for `ci` in GitHub → Settings → Branches).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Keep in step with apps/signaling/Dockerfile.
          bun-version: 1.3.12

      - name: Install (exact lockfile)
        run: bun install --frozen-lockfile

      - name: Tests
        run: bun test

      - name: Typecheck
        run: bun run typecheck

      - name: Build web app
        run: bun run build

      - name: Dependency advisories (fail on high or critical)
        run: bun audit --audit-level=high

      # wrangler needs Node 22 (ADR-007). Bundles the Cloudflare Worker exactly
      # as `wrangler deploy` would, without deploying or needing an account.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cloudflare Worker bundles
        working-directory: apps/signaling
        env:
          WRANGLER_SEND_METRICS: "false"
        run: node node_modules/wrangler/bin/wrangler.js deploy --dry-run --outdir "$RUNNER_TEMP/cf"
